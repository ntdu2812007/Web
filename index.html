<body class="min-h-screen text-slate-100 antialiased selection:bg-blue-600 selection:text-white">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ========================================================
    // SUPABASE CLOUD CONFIGURATION (TỰ ĐỘNG ĐỒNG BỘ ĐA THIẾT BỊ)
    // ========================================================
    const supabase = window.realtime ? window.realtime.supabase : null;

    // --- HELPER FORMAT TIỀN TỆ ---
    const formatVND = (amount) => {
      return new Intl.NumberFormat('vi-VN', { style: 'currency', currency: 'VND' }).format(amount || 0);
    };

    // --- UNIVERSAL LUCIDE ICON WRAPPER ---
    const LucideIcon = ({ name, size = 20, className = '', ...props }) => {
      const spanRef = useRef(null);
      const kebab = name.replace(/([a-z])([A-Z])/g, '$1-$2').toLowerCase();

      useEffect(() => {
        if (!spanRef.current) return;
        if (window.lucide) {
          const iconObj = window.lucide.icons && (window.lucide.icons[name] || window.lucide.icons[kebab]);
          if (iconObj && typeof iconObj.toSvg === 'function') {
            spanRef.current.innerHTML = iconObj.toSvg({ class: className, width: size, height: size });
            return;
          }
          spanRef.current.innerHTML = '<i data-lucide="' + kebab + '"></i>';
          window.lucide.createIcons({ root: spanRef.current });
          const svg = spanRef.current.querySelector('svg');
          if (svg) {
            if (className) svg.setAttribute('class', className);
            svg.setAttribute('width', size);
            svg.setAttribute('height', size);
          }
        }
      }, [name, size, className]);

      return (
        <span 
          ref={spanRef} 
          className={'inline-flex items-center justify-center ' + className} 
          style={{ width: size, height: size, display: 'inline-flex', verticalAlign: 'middle' }}
          {...props}
        />
      );
    };

    const iconNames = [
      'Users', 'ShoppingBag', 'Wallet', 'History', 'Bell', 'LogOut', 'CheckCircle', 
      'XCircle', 'PlusCircle', 'ArrowUpRight', 'ArrowDownLeft', 'Search', 'Filter', 
      'ShieldCheck', 'RefreshCw', 'ShoppingCart', 'ExternalLink', 'DollarSign',
      'TrendingUp', 'CreditCard', 'UserCheck', 'AlertCircle', 'Check', 'X', 'Key', 'Lock', 'Eye', 'EyeOff', 'Copy',
      'User', 'LogIn', 'Layers', 'Box', 'BarChart3'
    ];

    const iconComponents = {};
    iconNames.forEach(name => {
      iconComponents[name] = (props) => <LucideIcon name={name} {...props} />;
    });

    const { 
      Users, ShoppingBag, Wallet, History, Bell, LogOut, CheckCircle, 
      XCircle, PlusCircle, ArrowUpRight, ArrowDownLeft, Search, Filter, 
      ShieldCheck, RefreshCw, ShoppingCart, ExternalLink, DollarSign,
      TrendingUp, CreditCard, UserCheck, AlertCircle, Check, X, Key, Lock, Eye, EyeOff, Copy,
      User, LogIn, Layers, Box, BarChart3
    } = iconComponents;

    const ECOM_PLATFORMS = [
      { name: 'Shopee', logo: 'https://cdn.simpleicons.org/shopee', color: 'from-orange-500 to-amber-600', desc: 'Sàn TMĐT phổ biến nhất Việt Nam', url: 'https://shopee.vn/' },
      { name: 'Lazada', logo: 'https://www.google.com/s2/favicons?domain=lazada.vn&sz=128', color: 'from-blue-600 to-indigo-700', desc: 'Hệ thống mua sắm trực tuyến uy tín', url: 'https://www.lazada.vn/' },
      { name: 'TikTok Shop', logo: 'https://www.tiktok.com/favicon.ico', color: 'from-slate-800 to-slate-950', desc: 'Xu hướng mua sắm video ngắn', url: 'https://www.tiktok.com/shop?lang=vi-VN' },
      { name: 'Tiki', logo: 'https://tiki.vn/favicon.ico', color: 'from-sky-500 to-blue-600', desc: 'Giao hàng nhanh 2h chất lượng cao', url: 'https://tiki.vn/' },
      { name: 'Sendo', logo: 'https://www.google.com/s2/favicons?domain=sendo.vn&sz=128', color: 'from-red-600 to-rose-700', desc: 'Chợ tốt cho người Việt', url: 'https://www.sendo.vn/' },
    ];

    const BANK_CONFIG = {
      bankName: 'MB Bank (Ngân hàng Quân Đội)',
      accountNumber: '198082200407',
      accountHolder: 'NGUYEN DUC HUY',
      transferSyntaxPrefix: 'NAP TIEN'
    };

    // ========================================================
    // COMPONENT: MÀN HÌNH ĐĂNG NHẬP (KHỚP 100% ẢNH MẪU 562fa05d...)
    // ========================================================
    function LoginScreen({ cloudStatus, onLoginSuccess, showToast }) {
      const [loginForm, setLoginForm] = useState({ email: '', password: '' });
      const [loginError, setLoginError] = useState('');
      const [showPassword, setShowPassword] = useState(false);
      const [isLoggingIn, setIsLoggingIn] = useState(false);

      const handleSubmit = async (e) => {
        e.preventDefault();
        setLoginError('');

        if (cloudStatus !== 'CONNECTED') {
          setLoginError('Chưa kết nối được máy chủ dữ liệu. Vui lòng thử lại sau.');
          return;
        }

        const account = loginForm.email.trim();
        const password = loginForm.password.trim();

        setIsLoggingIn(true);
        try {
          const { data, error } = await supabase.rpc('login_staff', {
            p_account: account,
            p_password: password
          });
          if (error) throw error;

          const foundStaff = Array.isArray(data) ? data[0] : data;
          if (!foundStaff) {
            setLoginError('Tài khoản hoặc mật khẩu không chính xác!');
            return;
          }

          let adminStaff = null;
          if (foundStaff.role === 'ADMIN') {
            const { data: staffData, error: staffError } = await supabase.rpc('admin_list_staff', {
              p_admin_account: account,
              p_admin_password: password
            });
            if (staffError) throw staffError;
            adminStaff = (staffData || []).map(s => ({
              id: s.id,
              name: s.name,
              email: s.email,
              password: s.password,
              role: s.role,
              balance: Number(s.balance || 0),
              totalCommission: Number(s.total_commission || 0),
              completedOrders: Number(s.completed_orders || 0)
            }));
          }

          const user = {
            role: foundStaff.role,
            id: foundStaff.id,
            name: foundStaff.name,
            email: foundStaff.email,
            balance: Number(foundStaff.balance || 0),
            totalCommission: Number(foundStaff.total_commission || 0),
            completedOrders: Number(foundStaff.completed_orders || 0)
          };
          onLoginSuccess(user, adminStaff, { account, password });
          showToast('Đăng nhập thành công! Chào ' + foundStaff.name);
        } catch (error) {
          console.error('Supabase login failed:', error);
          setLoginError('Không thể xác thực với máy chủ. Hãy chạy migration đăng nhập trong Supabase.');
        } finally {
          setIsLoggingIn(false);
        }
      };

      return (
        <div className="min-h-screen bg-login-scene flex items-center justify-center p-4 sm:p-6 lg:p-8 relative">
          {/* Lớp phủ màu sẫm nhẹ để card nổi bật */}
          <div className="absolute inset-0 bg-[#040d25]/60 pointer-events-none"></div>

          {/* KHUNG CARD CHÍNH - BỎ PHÁT SÁNG TRẮNG, VIỀN CHÌM TINH TẾ */}
          <div className="relative z-10 w-full max-w-4xl rounded-[32px] glass-neon-panel overflow-hidden p-6 sm:p-10 lg:p-12 shadow-2xl shadow-black/60 border border-slate-800">
            <div className="grid grid-cols-1 lg:grid-cols-12 gap-8 lg:gap-10 items-center">
              
              {/* CỘT TRÁI: HÌNH ẢNH 3D E-COMMERCE LAPTOP SCENE */}
              <div className="lg:col-span-6 flex items-center justify-center">
                <div className="relative w-full max-w-[380px] aspect-square rounded-3xl overflow-hidden shadow-lg shadow-black/50 border border-slate-800">
                  <img 
                    src="img/Futuristic Blue E-Commerce Laptop Scene.png" 
                    alt="Laptop Scene" 
                    className="w-full h-full object-cover"
                  />
                  <div className="absolute inset-0 bg-gradient-to-tr from-[#06143d]/30 via-transparent to-transparent pointer-events-none"></div>
                </div>
              </div>

              {/* CỘT PHẢI: FORM ĐĂNG NHẬP TINH GỌN */}
              <div className="lg:col-span-6 flex flex-col justify-center">
                {/* Logo & Header */}
                <div className="text-center mb-6">
                  <div className="inline-flex items-center justify-center w-20 h-20 mb-2">
                    <img 
                      src="img/logo-transparent.png" 
                      alt="OMS Logo" 
                      className="w-full h-full object-contain filter drop-shadow-[0_4px_12px_rgba(0,0,0,0.4)]" 
                    />
                  </div>
                  <h1 className="text-2xl sm:text-3xl font-extrabold text-white tracking-wide">
                    Hệ Thống Đơn Hàng & Hoa Hồng
                  </h1>
                  <p className="text-blue-300 text-xs sm:text-sm mt-1.5 font-medium">
                    E-Commerce OMS & Affiliate Management
                  </p>
                </div>

                {loginError && (
                  <div className="mb-4 p-3.5 bg-rose-500/20 border border-rose-500/40 rounded-xl text-rose-200 text-xs sm:text-sm flex items-center gap-2.5">
                    <AlertCircle className="w-4 h-4 shrink-0 text-rose-400" />
                    <span>{loginError}</span>
                  </div>
                )}

                <form onSubmit={handleSubmit} className="space-y-5">
                  {/* Ô Tài khoản */}
                  <div>
                    <label className="block text-sm font-bold text-white mb-2">
                      Tài Khoản :
                    </label>
                    <div className="relative">
                      <div className="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-blue-400">
                        <User className="w-4 h-4" />
                      </div>
                      <input
                        type="text"
                        required
                        value={loginForm.email}
                        onChange={(e) => setLoginForm({ ...loginForm, email: e.target.value })}
                        placeholder="Nhập tài khoản hoặc mã nhân viên..."
                        className="w-full glass-neon-input rounded-xl pl-10 pr-4 py-3 text-white placeholder-slate-400 text-sm font-medium"
                      />
                    </div>
                  </div>

                  {/* Ô Mật khẩu */}
                  <div>
                    <label className="block text-sm font-bold text-white mb-2">
                      Mật Khẩu :
                    </label>
                    <div className="relative">
                      <div className="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-blue-400">
                        <Lock className="w-4 h-4" />
                      </div>
                      <input
                        type={showPassword ? "text" : "password"}
                        required
                        value={loginForm.password}
                        onChange={(e) => setLoginForm({ ...loginForm, password: e.target.value })}
                        placeholder="Nhập mật khẩu..."
                        className="w-full glass-neon-input rounded-xl pl-10 pr-11 py-3 text-white placeholder-slate-400 text-sm font-mono"
                      />
                      <button
                        type="button"
                        onClick={() => setShowPassword(!showPassword)}
                        className="absolute inset-y-0 right-0 pr-3.5 flex items-center text-blue-300 hover:text-white"
                      >
                        {showPassword ? <EyeOff className="w-4 h-4" /> : <Eye className="w-4 h-4" />}
                      </button>
                    </div>
                  </div>

                  {/* Nút Đăng Nhập Hệ Thống */}
                  <button
                    type="submit"
                    disabled={cloudStatus !== 'CONNECTED' || isLoggingIn}
                    className="w-full btn-neon-primary text-white font-bold py-3.5 rounded-xl text-sm flex items-center justify-center gap-2 mt-4 tracking-wide cursor-pointer disabled:opacity-50 disabled:cursor-not-allowed"
                  >
                    <LogIn className="w-4 h-4" />
                    {cloudStatus === 'CONNECTING' ? 'Đang kết nối máy chủ...' : cloudStatus === 'OFFLINE' ? 'Máy chủ chưa kết nối' : isLoggingIn ? 'Đang xác thực...' : 'Đăng nhập Hệ thống'}
                  </button>
                </form>

              </div>

            </div>
          </div>
        </div>
      );
    }

    // ========================================================
    // COMPONENT: ADMIN MODULE (KHỚP 100% ẢNH MẪU DARK-BLUE & NEON OMS)
    // ========================================================
    function AdminView({
      authCredentials,
      staffList,
      setStaffList,
      orders,
      setOrders,
      transactions,
      setTransactions,
      withdrawRequests,
      setWithdrawRequests,
      showToast
    }) {
      const [adminTab, setAdminTab] = useState('create-order');
      const adjustmentInProgress = useRef(false);

      // Form tạo đơn hàng mới
      const [orderForm, setOrderForm] = useState({
        customId: '',
        staffId: 'NV01',
        productName: '',
        platform: 'Shopee',
        orderValue: '',
        codAmount: '',
        commissionRate: 10
      });

      // Modals
      const [adjustModal, setAdjustModal] = useState(null);
      const [adjustAmount, setAdjustAmount] = useState('');
      const [adjustType, setAdjustType] = useState('ADD');
      const [adjustReason, setAdjustReason] = useState('');

      const [passwordModal, setPasswordModal] = useState(null);
      const [newPassword, setNewPassword] = useState('');

      const [staffSearch, setStaffSearch] = useState('');
      const [logFilter, setLogFilter] = useState('ALL');

      const pendingWithdrawalsCount = withdrawRequests.filter(w => w.status === 'PENDING').length;

      const handleGenerateOrderId = () => {
        const randNum = Math.floor(10000 + Math.random() * 90000);
        setOrderForm({ ...orderForm, customId: 'DH-' + randNum });
      };

      // 1. Tạo đơn hàng mới
      const handleCreateOrder = async (e) => {
        e.preventDefault();
        if (!orderForm.productName || !orderForm.orderValue) {
          showToast('Vui lòng điền tên sản phẩm và giá trị đơn hàng!', 'error');
          return;
        }

        let orderId = orderForm.customId.trim();
        if (!orderId) {
          orderId = 'DH-' + Math.floor(10000 + Math.random() * 90000);
        }

        // Kiểm tra trùng mã đơn hàng
        if (orders.some(o => o.id.toLowerCase() === orderId.toLowerCase())) {
          showToast('Mã đơn ' + orderId + ' đã tồn tại! Vui lòng nhập mã khác.', 'error');
          return;
        }

        const val = parseFloat(orderForm.orderValue) || 0;
        const cod = parseFloat(orderForm.codAmount) || 0;
        const rate = parseFloat(orderForm.commissionRate) || 0;
        const comm = Math.round(val * (rate / 100));

        const createdOrder = {
          id: orderId,
          staffId: orderForm.staffId,
          productName: orderForm.productName.trim(),
          platform: orderForm.platform,
          orderValue: val,
          codAmount: cod,
          commissionRate: rate,
          commissionAmount: comm,
          status: 'PENDING',
          createdAt: new Date().toLocaleString('vi-VN')
        };

        try {
          const { error } = await supabase.rpc('admin_create_order', {
            p_admin_account: authCredentials.account,
            p_admin_password: authCredentials.password,
            p_id: createdOrder.id,
            p_staff_id: createdOrder.staffId,
            p_product_name: createdOrder.productName,
            p_platform: createdOrder.platform,
            p_order_value: Math.round(createdOrder.orderValue),
            p_cod_amount: Math.round(createdOrder.codAmount),
            p_commission_rate: createdOrder.commissionRate,
            p_commission_amount: createdOrder.commissionAmount
          });
          if (error) throw error;

          setOrders(prev => [createdOrder, ...prev]);
          showToast('Đã tạo thành công đơn ' + orderId + ' cho ' + orderForm.staffId + '!');
        } catch (error) {
          console.error('Create order failed:', error);
          showToast('Không tạo được đơn hàng: ' + error.message, 'error');
          return;
        }

        setOrderForm({
          customId: '',
          staffId: orderForm.staffId,
          productName: '',
          platform: 'Shopee',
          orderValue: '',
          codAmount: '',
          commissionRate: 10
        });
      };

      // 2. Điều chỉnh số dư thủ công
      const handleSaveAdjustment = async (e) => {
        e.preventDefault();
        if (adjustmentInProgress.current || !adjustModal || !adjustAmount || isNaN(adjustAmount)) return;
        const val = Math.round(parseFloat(adjustAmount));
        if (val <= 0) return;
        const delta = adjustType === 'ADD' ? val : -val;
        const note = adjustReason || ('Admin ' + (adjustType === 'ADD' ? 'cộng' : 'trừ') + ' tiền thủ công');

        adjustmentInProgress.current = true;
        try {
          const { data, error } = await supabase.rpc('admin_adjust_staff_balance', {
            p_admin_account: authCredentials.account,
            p_admin_password: authCredentials.password,
            p_staff_id: adjustModal.id,
            p_delta: delta,
            p_note: note
          });
          if (error) throw error;
          const result = Array.isArray(data) ? data[0] : data;
          if (!result) throw new Error('Máy chủ không trả về kết quả điều chỉnh.');

          setStaffList(prev => prev.map(s => s.id === adjustModal.id
            ? { ...s, balance: Number(result.new_balance) }
            : s
          ));
          setTransactions(prev => [{
            id: result.transaction_id,
            userId: adjustModal.id,
            userName: adjustModal.name,
            type: 'ADJUSTMENT',
            amount: delta,
            note,
            status: 'SUCCESS',
            timestamp: new Date().toLocaleString('vi-VN')
          }, ...prev]);
          showToast('Đã ' + (adjustType === 'ADD' ? 'cộng' : 'trừ') + ' ' + formatVND(val) + ' cho ' + adjustModal.name);
          setAdjustModal(null);
          setAdjustAmount('');
          setAdjustReason('');
        } catch (error) {
          console.error('Balance adjustment failed:', error);
          showToast('Không điều chỉnh được số dư: ' + error.message, 'error');
        } finally {
          adjustmentInProgress.current = false;
        }
      };

      // 3. Đổi mật khẩu nhân viên
      const handleSavePassword = async (e) => {
        e.preventDefault();
        if (!passwordModal || !newPassword.trim()) return;

        try {
          const { error } = await supabase.rpc('admin_set_staff_password', {
            p_admin_account: authCredentials.account,
            p_admin_password: authCredentials.password,
            p_staff_id: passwordModal.id,
            p_new_password: newPassword.trim()
          });
          if (error) throw error;

    // ========================================================
    // COMPONENT: STAFF MODULE (ĐỒNG BỘ PHONG CÁCH NEON CYBER)
    // ========================================================
    function StaffView({
      user,
      authCredentials,
      setUser,
      staffList,
      setStaffList,
      orders,
      setOrders,
      transactions,
      setTransactions,
      withdrawRequests,
      setWithdrawRequests,
      showToast
    }) {
      const [staffTab, setStaffTab] = useState('orders');

      const [showDepositModal, setShowDepositModal] = useState(false);
      const [depositAmount, setDepositAmount] = useState('500000');
      const [depositNote, setDepositNote] = useState('');
      const [depositInProgress, setDepositInProgress] = useState(false);
      const depositLock = useRef(false);

      const [showWithdrawModal, setShowWithdrawModal] = useState(false);
      const [withdrawInProgress, setWithdrawInProgress] = useState(false);
      const withdrawLock = useRef(false);
      const [withdrawForm, setWithdrawForm] = useState({
        amount: '',
        bankName: 'MB Bank',
        bankAccount: '198082200407',
        accountName: 'NGUYEN DUC HUY'
      });

      const myOrders = orders.filter(o => o.staffId === user.id);
      const myPendingOrders = myOrders.filter(o => o.status === 'PENDING');
      const myTransactions = transactions.filter(t => t.userId === user.id);
      const reservedWithdrawAmount = withdrawRequests
        .filter(request => request.staffId === user.id && request.status === 'PENDING')
        .reduce((total, request) => total + request.amount, 0);
      const availableBalance = Math.max(0, user.balance - reservedWithdrawAmount);

      // Xác nhận đơn hàng -> Tự động cộng hoa hồng vào Ví
      const handleConfirmOrder = async (orderId) => {
        const ord = orders.find(o => o.id === orderId && o.staffId === user.id);
        if (!ord || ord.status !== 'PENDING') return;

        try {
          const { data: newBalance, error } = await supabase.rpc('staff_confirm_order', {
            p_account: authCredentials.account,
            p_password: authCredentials.password,
            p_order_id: orderId
          });
          if (error) throw error;

          setOrders(prev => prev.map(o => o.id === orderId ? { ...o, status: 'CONFIRMED' } : o));
          setStaffList(prev => prev.map(s => s.id === user.id ? {
            ...s,
            balance: Number(newBalance),
            totalCommission: s.totalCommission + ord.commissionAmount,
            completedOrders: s.completedOrders + 1
          } : s));
          showToast('Xác nhận thành công! +' + formatVND(ord.commissionAmount) + ' hoa hồng đã được cộng vào Ví COD!');
        } catch (error) {
          console.error('Order confirmation failed:', error);
          showToast('Không xác nhận được đơn hàng: ' + error.message, 'error');
        }
      };

      // Nạp tiền vào quỹ COD
      const handleConfirmDeposit = async (e) => {
        e.preventDefault();
        if (depositLock.current) return;
        const amt = parseFloat(depositAmount) || 0;
        if (amt <= 0) {
          showToast('Số tiền nạp phải lớn hơn 0.', 'error');
          return;
        }

        depositLock.current = true;
        setDepositInProgress(true);
        try {
          const { data, error } = await supabase.rpc('staff_deposit', {
            p_account: authCredentials.account,
            p_password: authCredentials.password,
            p_amount: Math.round(amt),
            p_note: depositNote || 'Nạp tiền ứng quỹ COD'
          });
          if (error) throw error;

          const result = Array.isArray(data) ? data[0] : data;
          if (!result) throw new Error('Máy chủ không trả về kết quả nạp tiền.');

          setStaffList(prev => prev.map(s =>
            s.id === user.id ? { ...s, balance: Number(result.new_balance) } : s
          ));
          setTransactions(prev => [{
            id: result.transaction_id,
            userId: user.id,
            userName: user.name,
            type: 'DEPOSIT',
            amount: Math.round(amt),
            note: depositNote || 'Nạp tiền ứng quỹ COD',
            status: 'SUCCESS',
            timestamp: new Date().toLocaleString('vi-VN')
          }, ...prev]);

          showToast('Nạp thành công +' + formatVND(Math.round(amt)) + ' vào quỹ COD!');
          setShowDepositModal(false);
        } catch (error) {
          console.error('Supabase deposit failed:', error);
          showToast('Nạp tiền thất bại: ' + error.message, 'error');
        } finally {
          depositLock.current = false;
          setDepositInProgress(false);
        }
      };

      // Gửi yêu cầu rút tiền
      const handleRequestWithdraw = async (e) => {
        e.preventDefault();
        if (withdrawLock.current) return;
        const amt = Math.round(parseFloat(withdrawForm.amount) || 0);

        if (amt <= 0) {
          showToast('Số tiền rút không hợp lệ!', 'error');
          return;
        }

        if (amt > availableBalance) {
          showToast('Số dư ví không đủ để rút số tiền này!', 'error');
          return;
        }

        const newReq = {
          id: 'WD-' + crypto.randomUUID(),
          staffId: user.id,
          staffName: user.name,
          bankName: withdrawForm.bankName,
          bankAccount: withdrawForm.bankAccount,
          accountName: withdrawForm.accountName,
          amount: amt,
          status: 'PENDING',
          createdAt: new Date().toLocaleString('vi-VN')
        };

        withdrawLock.current = true;
        setWithdrawInProgress(true);
        try {
          const { error } = await supabase.rpc('staff_request_withdraw', {
            p_account: authCredentials.account,
            p_password: authCredentials.password,
            p_id: newReq.id,
            p_amount: newReq.amount,
            p_bank_name: newReq.bankName,
            p_bank_account: newReq.bankAccount,
            p_account_name: newReq.accountName
          });
          if (error) throw error;

          setWithdrawRequests(prev => [newReq, ...prev]);
          showToast('Đã gửi yêu cầu rút ' + formatVND(amt) + '! Vui lòng chờ Admin phê duyệt.');
          setShowWithdrawModal(false);
          setWithdrawForm(prev => ({ ...prev, amount: '' }));
        } catch (error) {
          console.error('Withdraw request failed:', error);
          showToast('Không gửi được yêu cầu rút tiền: ' + error.message, 'error');
        } finally {
          withdrawLock.current = false;
          setWithdrawInProgress(false);
        }
      };

      return (
        <div className="space-y-6">
          {/* TỔNG QUAN VÍ NHÂN VIÊN */}
          <div className="grid grid-cols-1 sm:grid-cols-3 gap-5">
            <div className="glass-neon-panel rounded-3xl p-6 relative overflow-hidden">
              <div className="flex justify-between items-start">
                <div>
                  <span className="text-xs font-bold text-blue-300 uppercase tracking-wider">Số Dư Ví COD Hiện Tại</span>
                  <div className="text-2xl sm:text-3xl font-extrabold text-emerald-400 mt-1 font-mono">
                    {formatVND(user.balance)}
                  </div>
                </div>
                <div className="p-3 bg-emerald-500/20 text-emerald-400 rounded-2xl border border-slate-800">
                  <Wallet className="w-6 h-6" />
                </div>
              </div>
              <div className="mt-4 flex gap-2">
                <button
                  onClick={() => setShowDepositModal(true)}
                  className="px-3.5 py-2 bg-emerald-600 hover:bg-emerald-500 text-white rounded-xl text-xs font-bold flex items-center gap-1.5 shadow-md shadow-black/30 cursor-pointer"
                >
                  <ArrowDownLeft className="w-4 h-4" /> Nạp COD
                </button>
                <button
                  onClick={() => setShowWithdrawModal(true)}
                  className="px-3.5 py-2 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white rounded-xl text-xs font-bold flex items-center gap-1.5 shadow-md shadow-black/30 cursor-pointer"
                >
                  <ArrowUpRight className="w-4 h-4" /> Rút Tiền
                </button>
              </div>
            </div>

            <div className="glass-neon-panel rounded-3xl p-6 relative overflow-hidden">
              <div className="flex justify-between items-start">
                <div>
                  <span className="text-xs font-bold text-blue-300 uppercase tracking-wider">Tổng Hoa Hồng Đã Nhận</span>
                  <div className="text-2xl sm:text-3xl font-extrabold text-fuchsia-400 mt-1 font-mono">
                    {formatVND(user.totalCommission)}
                  </div>
                </div>
                <div className="p-3 bg-purple-500/20 text-purple-300 rounded-2xl border border-slate-800">
                  <TrendingUp className="w-6 h-6" />
                </div>
              </div>
              <p className="text-xs text-blue-200/70 mt-4">Hoa hồng tự động ghi nhận khi đơn hoàn tất</p>
            </div>

            <div className="glass-neon-panel rounded-3xl p-6 relative overflow-hidden">
              <div className="flex justify-between items-start">
                <div>
                  <span className="text-xs font-bold text-blue-300 uppercase tracking-wider">Đơn Hàng Chờ Nhận</span>
                  <div className="text-2xl sm:text-3xl font-extrabold text-amber-300 mt-1 font-mono">
                    {myPendingOrders.length} Đơn
                  </div>
                </div>
                <div className="p-3 bg-amber-500/20 text-amber-300 rounded-2xl border border-slate-800">
                  <ShoppingBag className="w-6 h-6" />
                </div>
              </div>
              <p className="text-xs text-blue-200/70 mt-4">Xác nhận để nhận ngay hoa hồng vào ví</p>
            </div>
          </div>

          {/* TABS HEADER NHÂN VIÊN */}
          <div className="flex flex-wrap items-center gap-3 pb-2">
            <button
              onClick={() => setStaffTab('orders')}
              className={'flex items-center gap-2 px-5 py-3 rounded-2xl text-xs sm:text-sm font-bold transition ' + (
                staffTab === 'orders' ? 'tab-neon-active' : 'tab-neon-inactive'
              )}
            >
              <ShoppingBag className="w-4 h-4" />
              Đơn Cần Xác Nhận ({myPendingOrders.length})
            </button>

            <button
              onClick={() => setStaffTab('platforms')}
              className={'flex items-center gap-2 px-5 py-3 rounded-2xl text-xs sm:text-sm font-bold transition ' + (
                staffTab === 'platforms' ? 'tab-neon-active' : 'tab-neon-inactive'
              )}
            >
              <Layers className="w-4 h-4" />
              Sàn TMĐT Liên Kết
            </button>

            <button
              onClick={() => setStaffTab('history')}
              className={'flex items-center gap-2 px-5 py-3 rounded-2xl text-xs sm:text-sm font-bold transition ' + (
                staffTab === 'history' ? 'tab-neon-active' : 'tab-neon-inactive'
              )}
            >
              <History className="w-4 h-4" />
              Lịch Sử Giao Dịch Ví
            </button>
          </div>

          {/* TAB 1: ĐƠN CẦN XÁC NHẬN */}
          {staffTab === 'orders' && (
            <div className="glass-neon-panel rounded-3xl p-6 sm:p-8 space-y-6">
              <div className="border-b border-slate-800 pb-4">
                <h2 className="text-xl font-extrabold text-white">Danh Sách Đơn Hàng Cần Nhận & Xác Nhận</h2>
                <p className="text-xs text-blue-200/70 mt-1">

                <div className="bg-[#071333] p-3 rounded-xl border border-slate-800 text-xs flex justify-between">
                  <span className="text-blue-200">Số dư khả dụng:</span>
                  <span className="text-emerald-400 font-bold font-mono">{formatVND(availableBalance)}</span>

    // ========================================================
    // ROOT APP COMPONENT (CHỨA HEADER & SHELL CHUẨN MẪU)
    // ========================================================
    function App() {
      const [staffList, setStaffList] = useState([]);
      const [orders, setOrders] = useState([]);
      const [transactions, setTransactions] = useState([]);
      const [withdrawRequests, setWithdrawRequests] = useState([]);
      const [user, setUser] = useState(null);
      const [authCredentials, setAuthCredentials] = useState(null);
      const [realtimeConnected, setRealtimeConnected] = useState(false);
      const syncGeneration = useRef(0);

      const handleLoginSuccess = (nextUser, adminStaff, credentials) => {
        setUser(nextUser);
        setAuthCredentials(credentials);
        if (adminStaff) setStaffList(adminStaff);
      };

      const [toast, setToast] = useState(null);
      const [cloudStatus, setCloudStatus] = useState('CONNECTING'); // 'CONNECTED' | 'OFFLINE' | 'CONNECTING'

      const showToast = (message, type = 'success') => {
        setToast({ message, type });
        setTimeout(() => setToast(null), 3500);
      };

      // Load shared records and only the staff rows allowed for the signed-in account.
      const syncFromSupabase = async () => {
        const requestId = ++syncGeneration.current;
        if (!supabase) {
          setCloudStatus('OFFLINE');
          return;
        }

        try {
          if (!user || !authCredentials) {
            const { error } = await supabase.rpc('login_staff', {
              p_account: '__connection_check__',
              p_password: '__connection_check__'
            });
            if (error) throw error;
            if (requestId === syncGeneration.current) setCloudStatus('CONNECTED');
            return;
          }

          const [accountDataResult, staffResult] = await Promise.all([
            supabase.rpc('load_account_data', {
              p_account: authCredentials.account,
              p_password: authCredentials.password
            }),
            user.role === 'ADMIN'
              ? supabase.rpc('admin_list_staff', {
                  p_admin_account: authCredentials.account,
                  p_admin_password: authCredentials.password
                })
              : supabase.rpc('login_staff', {
                  p_account: authCredentials.account,
                  p_password: authCredentials.password
                })
          ]);
          if (accountDataResult.error) throw accountDataResult.error;
          if (staffResult.error) throw staffResult.error;
          if (requestId !== syncGeneration.current) return;

          const accountData = accountDataResult.data;
          const staffRows = Array.isArray(staffResult.data)
            ? staffResult.data
            : staffResult.data ? [staffResult.data] : [];
          setStaffList(staffRows.map(s => ({
            id: s.id,
            name: s.name,
            email: s.email,
            password: s.password,
            role: s.role,
            balance: Number(s.balance || 0),
            totalCommission: Number(s.total_commission || 0),
            completedOrders: Number(s.completed_orders || 0)
          })));

          setOrders((accountData.orders || []).map(o => ({
            id: o.id,
            staffId: o.staff_id,
            productName: o.product_name,
            platform: o.platform,
            orderValue: Number(o.order_value || 0),
            codAmount: Number(o.cod_amount || 0),
            commissionRate: Number(o.commission_rate || 0),
            commissionAmount: Number(o.commission_amount || 0),
            status: o.status,
            createdAt: new Date(o.created_at).toLocaleString('vi-VN')
          })));
          setTransactions((accountData.transactions || []).map(t => ({
            id: t.id,
            userId: t.user_id,
            userName: t.user_name,
            type: t.type,
            amount: Number(t.amount || 0),
            note: t.note,
            status: t.status,
            timestamp: new Date(t.timestamp).toLocaleString('vi-VN')
          })));
          setWithdrawRequests((accountData.withdraw_requests || []).map(w => ({
            id: w.id,
            staffId: w.staff_id,
            staffName: w.staff_name,
            bankName: w.bank_name,
            bankAccount: w.bank_account,
            accountName: w.account_name,
            amount: Number(w.amount || 0),
            status: w.status,
            createdAt: new Date(w.created_at).toLocaleString('vi-VN')
          })));

          setCloudStatus('CONNECTED');
        } catch (err) {
          console.error("Supabase data load failed:", err);
          if (requestId === syncGeneration.current) setCloudStatus('OFFLINE');
        }
      };

      useEffect(() => {
        syncFromSupabase();

        if (supabase) {
          let refreshTimer;
          const channel = supabase.channel('oms-data-changes')
            .on('broadcast', { event: 'data_changed' }, message => {
              const change = message.payload;
              if (change?.operation === 'INSERT') {
                if (change.table === 'withdraw_requests' && user?.role === 'ADMIN') {
                  showToast(`Có yêu cầu rút tiền mới từ ${change.staff_id || 'nhân viên'}.`, 'info');
                } else if (change.table === 'orders' && user?.role === 'STAFF' && change.staff_id === user.id) {
                  showToast('Bạn có đơn hàng mới được phân công.', 'info');
                }
              }
              clearTimeout(refreshTimer);
              refreshTimer = setTimeout(syncFromSupabase, 150);
            })
            .subscribe(status => {
              const connected = status === 'SUBSCRIBED';
              setRealtimeConnected(connected);
              if (!connected) console.warn('OMS Realtime channel status:', status);
            });

          return () => {
            clearTimeout(refreshTimer);
            supabase.removeChannel(channel);
            setRealtimeConnected(false);
          };
        }
      }, [user?.id, user?.role, authCredentials?.account, authCredentials?.password]);

      // Đồng bộ user state khi staffList thay đổi
      useEffect(() => {
        if (user && user.role === 'STAFF') {
          const updatedStaff = staffList.find(s => s.id === user.id);
          if (updatedStaff) {
            setUser(prev => ({ ...prev, ...updatedStaff }));
          }
        }
      }, [staffList]);

      const handleLogout = () => {
        setUser(null);
        setAuthCredentials(null);
        showToast('Đã đăng xuất khỏi hệ thống', 'info');
      };

      return (
        <div className={`min-h-screen text-slate-100 flex flex-col font-sans ${!user ? 'bg-login-scene' : 'bg-dashboard-scene'}`}>
          {/* TOAST NOTIFICATION */}
          {toast && (
            <div className="fixed top-5 right-5 z-50 flex items-center gap-2.5 glass-neon-panel text-white px-5 py-3.5 rounded-2xl shadow-2xl border border-slate-800 animate-bounce">
              {toast.type === 'success' ? <CheckCircle className="w-5 h-5 text-emerald-400" /> : <AlertCircle className="w-5 h-5 text-amber-400" />}
              <span className="text-xs sm:text-sm font-bold">{toast.message}</span>
            </div>
          )}

          {!user ? (
            <LoginScreen cloudStatus={cloudStatus} onLoginSuccess={handleLoginSuccess} showToast={showToast} />
          ) : (
            <>
              {/* HEADER BAR CHUẨN MẪU (THEO ĐÚNG ẢNH MẪU OMS SYSTEM) */}
              <header className="sticky top-0 z-40 bg-[#040d25]/80 backdrop-blur-xl border-b border-slate-800">
                <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                  <div className="flex items-center justify-between h-20">
                    
                    {/* Logo & Quyền hạn */}
                    <div className="flex items-center gap-3.5">
                      <div className="w-12 h-12 flex items-center justify-center">
                        <img 
                          src="img/logo-transparent.png" 
                          alt="OMS Logo" 
                          className="w-full h-full object-contain filter drop-shadow-[0_2px_8px_rgba(0,0,0,0.3)]" 
                        />
                      </div>
                      <div className="flex items-center gap-2.5">
                        <span className="font-extrabold text-xl text-white tracking-wide">
                          OMS System
                        </span>
                        <span className={'text-xs px-3 py-1 rounded-full font-bold border ' + (
                          user.role === 'ADMIN'
                            ? 'bg-purple-500/15 text-purple-300 border-slate-800 shadow-sm shadow-black/30'
                            : 'bg-cyan-500/15 text-cyan-300 border-slate-800 shadow-sm shadow-black/30'
                        )}>
                          {user.role === 'ADMIN' ? '👑 Quản Trị Viên' : '💼 ' + user.name + ' (' + user.id + ')'}
                        </span>
                      </div>
                    </div>

                    {/* Tiện ích & Nút Đăng Xuất */}
                    <div className="flex items-center gap-3 sm:gap-4">
                      {/* Trạng thái Supabase Cloud Sync */}
                      {cloudStatus === 'CONNECTED' && realtimeConnected ? (
                        <div className="hidden md:flex items-center gap-1.5 px-3 py-1.5 rounded-full text-[11px] font-bold bg-emerald-500/15 text-emerald-400 border border-emerald-500/30">
                          <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                          <span>Cloud Sync: Live</span>
                        </div>
                      ) : (
                        <div className="hidden md:flex items-center gap-1.5 px-3 py-1.5 rounded-full text-[11px] font-bold bg-amber-500/15 text-amber-300 border border-amber-500/30" title="Chạy supabase_schema.sql trong Supabase để bật Cloud Realtime">
                          <span className="w-2 h-2 rounded-full bg-amber-400"></span>
                          <span>{cloudStatus === 'CONNECTING' ? 'Đang kết nối...' : 'Cloud Realtime Offline'}</span>
                        </div>
                      )}

                      {user.role === 'STAFF' && (
                        <div className="hidden sm:flex items-center gap-2 glass-neon-card px-4 py-2 rounded-xl border border-slate-800">
                          <Wallet className="w-4 h-4 text-emerald-400" />
                          <span className="text-xs text-blue-200">Ví COD:</span>
                          <span className="font-mono font-extrabold text-sm text-emerald-400">{formatVND(user.balance)}</span>
                        </div>
                      )}

                      <button
                        onClick={handleLogout}
                        className="flex items-center gap-2 px-4 py-2.5 rounded-xl text-xs font-bold transition text-rose-300 hover:text-white bg-rose-500/10 hover:bg-rose-500/25 border border-rose-500/30 shadow-sm shadow-black/20 cursor-pointer"
                      >
                        <LogOut className="w-4 h-4 text-rose-400" />
                        <span>Đăng xuất</span>
                      </button>
                    </div>

                  </div>
                </div>
              </header>

              {/* MAIN CONTENT CONTAINER */}
              <main className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex-1 w-full">
                {user.role === 'ADMIN' ? (
                  <AdminView
                    authCredentials={authCredentials}
                    staffList={staffList}
                    setStaffList={setStaffList}
                    orders={orders}
                    setOrders={setOrders}
                    transactions={transactions}
                    setTransactions={setTransactions}
                    withdrawRequests={withdrawRequests}
                    setWithdrawRequests={setWithdrawRequests}
                    showToast={showToast}
                  />
                ) : (
                  <StaffView
                    user={user}
                    authCredentials={authCredentials}
                    setUser={setUser}
                    staffList={staffList}
                    setStaffList={setStaffList}
                    orders={orders}
                    setOrders={setOrders}
                    transactions={transactions}
                    setTransactions={setTransactions}
                    withdrawRequests={withdrawRequests}
                    setWithdrawRequests={setWithdrawRequests}
                    showToast={showToast}
                  />
                )}
              </main>

              {/* FOOTER */}
              <footer className="border-t border-slate-800 py-5 text-center text-xs text-blue-300/60 bg-[#040d25]/90">
                Hệ Thống Quản Lý Đơn Hàng & Vận Hành Affiliate (OMS) © 2026 - Môn học: Thương Mại Điện Tử
              </footer>
            </>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
