    const LucideIcon = ({ name, size = 20, className = '', ...props }) => {
      const spanRef = useRef(null);
      const kebab = name.replace(/([a-z])([A-Z])/g, '$1-$2').toLowerCase();

      useEffect(() => {
        if (!spanRef.current) return;
        if (window.lucide) {
          const iconObj = window.lucide.icons && (window.lucide.icons[name] || window.lucide.icons[kebab]);
          if (iconObj && typeof iconObj.toSvg === 'function') {
            spanRef.current.innerHTML = iconObj.toSvg({ class: className, width: size, height: size });
            return;
          }
          spanRef.current.innerHTML = '<i data-lucide="' + kebab + '"></i>';
          window.lucide.createIcons({ root: spanRef.current });
          const svg = spanRef.current.querySelector('svg');
          if (svg) {
            if (className) svg.setAttribute('class', className);
            svg.setAttribute('width', size);
            svg.setAttribute('height', size);
          }
        }
      }, [name, size, className]);

      return (
        <span 
          ref={spanRef} 
          className={'inline-flex items-center justify-center ' + className} 
          style={{ width: size, height: size, display: 'inline-flex', verticalAlign: 'middle' }}
          {...props}

          userName: adjustModal.name,
          type: 'ADJUSTMENT',
          amount: delta,
          note: adjustReason || ('Admin ' + (adjustType === 'ADD' ? 'cộng' : 'trừ') + ' tiền thủ công'),
          status: 'SUCCESS',
          timestamp: new Date().toLocaleString('vi-VN')

        setTransactions([newTx, ...transactions]);

            type: newTx.type,

          id: 'TX-' + Math.floor(1000 + Math.random() * 9000),
          userId: targetReq.staffId,
          userName: targetReq.staffName,

          amount: -targetReq.amount,

    // ========================================================
    // COMPONENT: STAFF MODULE (ĐỒNG BỘ PHONG CÁCH NEON CYBER)
    // ========================================================
    function StaffView({
      user,
      setUser,
      staffList,
      setStaffList,
      orders,
      setOrders,
      transactions,
      setTransactions,
      withdrawRequests,
      setWithdrawRequests,
      showToast
    }) {
      const [staffTab, setStaffTab] = useState('orders');

      const [showDepositModal, setShowDepositModal] = useState(false);
      const [depositAmount, setDepositAmount] = useState('500000');
      const [depositNote, setDepositNote] = useState('');

      const [showWithdrawModal, setShowWithdrawModal] = useState(false);
      const [withdrawForm, setWithdrawForm] = useState({
        amount: '',
        bankName: 'MB Bank',
        bankAccount: '198082200407',
        accountName: 'NGUYEN DUC HUY'
      });

      const myOrders = orders.filter(o => o.staffId === user.id);
      const myPendingOrders = myOrders.filter(o => o.status === 'PENDING');
      const myTransactions = transactions.filter(t => t.userId === user.id);

      // Xác nhận đơn hàng -> Tự động cộng hoa hồng vào Ví
      const handleConfirmOrder = (orderId) => {
        const ord = orders.find(o => o.id === orderId && o.staffId === user.id);
        if (!ord || ord.status !== 'PENDING') return;

        setOrders(prev => prev.map(o => o.id === orderId ? { ...o, status: 'CONFIRMED' } : o));

        const commission = ord.commissionAmount;
        setStaffList(prev => prev.map(s => {
          if (s.id === user.id) {
            return {
              ...s,
              balance: s.balance + commission,
              totalCommission: s.totalCommission + commission,
              completedOrders: s.completedOrders + 1
            };
          }
          return s;
        }));

        const newTx = {
          id: 'TX-' + Math.floor(1000 + Math.random() * 9000),
          userId: user.id,
          userName: user.name,
          type: 'COMMISSION',
          amount: commission,
          note: 'Hoa hồng đơn hàng ' + ord.id + ' (' + ord.platform + ')',
          status: 'SUCCESS',
          timestamp: new Date().toLocaleString('vi-VN')
        };
        setTransactions([newTx, ...transactions]);

        showToast('Xác nhận thành công! +' + formatVND(commission) + ' hoa hồng đã được cộng vào Ví COD!');

        if (supabase) {
          supabase.from('orders').update({ status: 'CONFIRMED', confirmed_at: new Date().toISOString() }).eq('id', orderId).then();
          supabase.from('staff').update({
            balance: user.balance + commission,
            total_commission: user.totalCommission + commission,
            completed_orders: user.completedOrders + 1
          }).eq('id', user.id).then();
          supabase.from('transactions').insert([{
            id: newTx.id,
            user_id: newTx.userId,
            user_name: newTx.userName,
            type: newTx.type,
            amount: newTx.amount,
            note: newTx.note,
            status: newTx.status,
            timestamp: new Date().toISOString()
          }]).then();
        }
      };

      // Nạp tiền vào quỹ COD
      const handleConfirmDeposit = (e) => {
        e.preventDefault();
        const amt = parseFloat(depositAmount) || 0;
        if (amt <= 0) return;

        setStaffList(prev => prev.map(s => {
          if (s.id === user.id) {
            return { ...s, balance: s.balance + amt };
          }
          return s;
        }));

        const newTx = {
          id: 'TX-' + Math.floor(1000 + Math.random() * 9000),
          userId: user.id,
          userName: user.name,
          type: 'DEPOSIT',
          amount: amt,
          note: depositNote || 'Nạp tiền ứng quỹ COD',
          status: 'SUCCESS',
          timestamp: new Date().toLocaleString('vi-VN')
        };
        setTransactions([newTx, ...transactions]);

        showToast('Nạp thành công +' + formatVND(amt) + ' vào quỹ COD!');

        if (supabase) {
          supabase.from('staff').update({ balance: user.balance + amt }).eq('id', user.id).then();
          supabase.from('transactions').insert([{
            id: newTx.id,
            user_id: newTx.userId,
            user_name: newTx.userName,
            type: newTx.type,
            amount: newTx.amount,
            note: newTx.note,
            status: newTx.status,
            timestamp: new Date().toISOString()
          }]).then();
        }

        setShowDepositModal(false);
      };

      // Gửi yêu cầu rút tiền
      const handleRequestWithdraw = (e) => {
        e.preventDefault();
        const amt = parseFloat(withdrawForm.amount) || 0;

        if (amt <= 0) {
          showToast('Số tiền rút không hợp lệ!', 'error');
          return;
        }

        if (amt > user.balance) {
          showToast('Số dư ví không đủ để rút số tiền này!', 'error');
          return;
        }

        const newReq = {
          id: 'WD-' + Math.floor(100 + Math.random() * 900),
          staffId: user.id,
          staffName: user.name,
          bankName: withdrawForm.bankName,
          bankAccount: withdrawForm.bankAccount,
          accountName: withdrawForm.accountName,
          amount: amt,
          status: 'PENDING',
          createdAt: new Date().toLocaleString('vi-VN')
        };

        setWithdrawRequests([newReq, ...withdrawRequests]);
        showToast('Đã gửi yêu cầu rút ' + formatVND(amt) + '! Vui lòng chờ Admin phê duyệt.');

        if (supabase) {
          supabase.from('withdraw_requests').insert([{
            id: newReq.id,
            staff_id: newReq.staffId,
            staff_name: newReq.staffName,
            bank_name: newReq.bankName,
            bank_account: newReq.bankAccount,
            account_name: newReq.accountName,
            amount: newReq.amount,
            status: 'PENDING',
            created_at: new Date().toISOString()
          }]).then();
        }
        setShowWithdrawModal(false);
        setWithdrawForm({ ...withdrawForm, amount: '' });
      };

      return (
        <div className="space-y-6">
          {/* TỔNG QUAN VÍ NHÂN VIÊN */}
          <div className="grid grid-cols-1 sm:grid-cols-3 gap-5">
            <div className="glass-neon-panel rounded-3xl p-6 relative overflow-hidden">
              <div className="flex justify-between items-start">
                <div>
                  <span className="text-xs font-bold text-blue-300 uppercase tracking-wider">Số Dư Ví COD Hiện Tại</span>
                  <div className="text-2xl sm:text-3xl font-extrabold text-emerald-400 mt-1 font-mono">
                    {formatVND(user.balance)}
                  </div>
                </div>
                <div className="p-3 bg-emerald-500/20 text-emerald-400 rounded-2xl border border-slate-800">
                  <Wallet className="w-6 h-6" />
                </div>
              </div>
              <div className="mt-4 flex gap-2">
                <button
                  onClick={() => setShowDepositModal(true)}
                  className="px-3.5 py-2 bg-emerald-600 hover:bg-emerald-500 text-white rounded-xl text-xs font-bold flex items-center gap-1.5 shadow-md shadow-black/30 cursor-pointer"
                >
                  <ArrowDownLeft className="w-4 h-4" /> Nạp COD
                </button>
                <button
                  onClick={() => setShowWithdrawModal(true)}
                  className="px-3.5 py-2 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white rounded-xl text-xs font-bold flex items-center gap-1.5 shadow-md shadow-black/30 cursor-pointer"
                >
                  <ArrowUpRight className="w-4 h-4" /> Rút Tiền
                </button>
              </div>
            </div>

            <div className="glass-neon-panel rounded-3xl p-6 relative overflow-hidden">
              <div className="flex justify-between items-start">
                <div>
                  <span className="text-xs font-bold text-blue-300 uppercase tracking-wider">Tổng Hoa Hồng Đã Nhận</span>
                  <div className="text-2xl sm:text-3xl font-extrabold text-fuchsia-400 mt-1 font-mono">
                    {formatVND(user.totalCommission)}
                  </div>
                </div>
                <div className="p-3 bg-purple-500/20 text-purple-300 rounded-2xl border border-slate-800">
                  <TrendingUp className="w-6 h-6" />
                </div>
              </div>

    // ========================================================
    // ROOT APP COMPONENT (CHỨA HEADER & SHELL CHUẨN MẪU)
    // ========================================================
    function App() {
      const [staffList, setStaffList] = useState(() => loadStorage('staffList', INITIAL_STAFF));
      const [orders, setOrders] = useState(() => loadStorage('orders', INITIAL_ORDERS));
      const [transactions, setTransactions] = useState(() => loadStorage('transactions', INITIAL_TRANSACTIONS));
      const [withdrawRequests, setWithdrawRequests] = useState(() => loadStorage('withdrawals', INITIAL_WITHDRAWALS));
      const [user, setUser] = useState(() => loadStorage('currentUser', null));

      const [toast, setToast] = useState(null);
      const [cloudStatus, setCloudStatus] = useState('CONNECTING'); // 'CONNECTED' | 'OFFLINE' | 'CONNECTING'

      const showToast = (message, type = 'success') => {
        setToast({ message, type });
        setTimeout(() => setToast(null), 3500);
      };

      // TỰ ĐỘNG ĐỒNG BỘ SUPABASE CLOUD (KẾT NỐI ONLINE / OFFLINE FALLBACK)
      const syncFromSupabase = async () => {
        if (!supabase) {
          setCloudStatus('OFFLINE');
          return;
        }

        try {
          // 1. Fetch Staff
          const { data: staffData, error: staffErr } = await supabase.from('staff').select('*');
          if (!staffErr && staffData && staffData.length > 0) {
            const mappedStaff = staffData.map(s => ({
              id: s.id,
              name: s.name,
              email: s.email,
              password: s.password,
              balance: Number(s.balance || 0),
              totalCommission: Number(s.total_commission || 0),
              completedOrders: Number(s.completed_orders || 0)
            }));
            setStaffList(mappedStaff);
          }

          // 2. Fetch Orders
          const { data: ordData } = await supabase.from('orders').select('*').order('created_at', { ascending: false });
          if (ordData && ordData.length > 0) {
            setOrders(ordData.map(o => ({
              id: o.id,
              staffId: o.staff_id,
              productName: o.product_name,
              platform: o.platform,
              orderValue: Number(o.order_value || 0),
              codAmount: Number(o.cod_amount || 0),
              commissionRate: Number(o.commission_rate || 0),
              commissionAmount: Number(o.commission_amount || 0),
              status: o.status,
              createdAt: new Date(o.created_at).toLocaleString('vi-VN')
            })));
          }

          // 3. Fetch Transactions
          const { data: txData } = await supabase.from('transactions').select('*').order('timestamp', { ascending: false });
          if (txData && txData.length > 0) {
            setTransactions(txData.map(t => ({
              id: t.id,
              userId: t.user_id,
              userName: t.user_name,
              type: t.type,
              amount: Number(t.amount || 0),
              note: t.note,
              status: t.status,
              timestamp: new Date(t.timestamp).toLocaleString('vi-VN')
            })));
          }

          // 4. Fetch Withdrawals
          const { data: wdData } = await supabase.from('withdraw_requests').select('*').order('created_at', { ascending: false });
          if (wdData && wdData.length > 0) {
            setWithdrawRequests(wdData.map(w => ({
              id: w.id,
              staffId: w.staff_id,
              staffName: w.staff_name,
              bankName: w.bank_name,
              bankAccount: w.bank_account,
              accountName: w.account_name,
              amount: Number(w.amount || 0),
              status: w.status,
              createdAt: new Date(w.created_at).toLocaleString('vi-VN')
            })));
          }

          setCloudStatus('CONNECTED');
        } catch (err) {
          console.warn("Supabase fetch fallback to local:", err);
          setCloudStatus('OFFLINE');
        }
      };

      useEffect(() => {
        syncFromSupabase();

        // Đăng ký Supabase Realtime Channel để đồng bộ giữa các máy
        if (supabase) {
          const channel = supabase.channel('oms_cloud_realtime')
            .on('postgres_changes', { event: '*', schema: 'public', table: 'orders' }, () => syncFromSupabase())
            .on('postgres_changes', { event: '*', schema: 'public', table: 'staff' }, () => syncFromSupabase())
            .on('postgres_changes', { event: '*', schema: 'public', table: 'withdraw_requests' }, () => syncFromSupabase())
            .on('postgres_changes', { event: '*', schema: 'public', table: 'transactions' }, () => syncFromSupabase())
            .subscribe();

          return () => {
            supabase.removeChannel(channel);
          };
        }
      }, []);

      // Tự động lưu LocalStorage cache
      useEffect(() => { saveStorage('staffList', staffList); }, [staffList]);
      useEffect(() => { saveStorage('orders', orders); }, [orders]);
      useEffect(() => { saveStorage('transactions', transactions); }, [transactions]);
      useEffect(() => { saveStorage('withdrawals', withdrawRequests); }, [withdrawRequests]);
      useEffect(() => { saveStorage('currentUser', user); }, [user]);

      // Đồng bộ user state khi staffList thay đổi
      useEffect(() => {
        if (user && user.role === 'STAFF') {
          const updatedStaff = staffList.find(s => s.id === user.id);
          if (updatedStaff) {
            setUser(prev => ({ ...prev, ...updatedStaff }));
          }
        }
      }, [staffList]);

      const handleLogout = () => {
        setUser(null);
        showToast('Đã đăng xuất khỏi hệ thống', 'info');
      };

      return (
        <div className={`min-h-screen text-slate-100 flex flex-col font-sans ${!user ? 'bg-login-scene' : 'bg-dashboard-scene'}`}>
          {/* TOAST NOTIFICATION */}
          {toast && (
            <div className="fixed top-5 right-5 z-50 flex items-center gap-2.5 glass-neon-panel text-white px-5 py-3.5 rounded-2xl shadow-2xl border border-slate-800 animate-bounce">
              {toast.type === 'success' ? <CheckCircle className="w-5 h-5 text-emerald-400" /> : <AlertCircle className="w-5 h-5 text-amber-400" />}
              <span className="text-xs sm:text-sm font-bold">{toast.message}</span>
            </div>
          )}

          {!user ? (
            <LoginScreen staffList={staffList} onLoginSuccess={setUser} showToast={showToast} />
          ) : (
            <>
              {/* HEADER BAR CHUẨN MẪU (THEO ĐÚNG ẢNH MẪU OMS SYSTEM) */}
              <header className="sticky top-0 z-40 bg-[#040d25]/80 backdrop-blur-xl border-b border-slate-800">
                <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                  <div className="flex items-center justify-between h-20">
                    
                    {/* Logo & Quyền hạn */}
                    <div className="flex items-center gap-3.5">
                      <div className="w-12 h-12 flex items-center justify-center">
                        <img 
                          src="img/logo-transparent.png" 
                          alt="OMS Logo" 
                          className="w-full h-full object-contain filter drop-shadow-[0_2px_8px_rgba(0,0,0,0.3)]" 
                        />
                      </div>
                      <div className="flex items-center gap-2.5">
                        <span className="font-extrabold text-xl text-white tracking-wide">
                          OMS System
                        </span>
                        <span className={'text-xs px-3 py-1 rounded-full font-bold border ' + (
                          user.role === 'ADMIN'
                            ? 'bg-purple-500/15 text-purple-300 border-slate-800 shadow-sm shadow-black/30'
                            : 'bg-cyan-500/15 text-cyan-300 border-slate-800 shadow-sm shadow-black/30'
                        )}>
                          {user.role === 'ADMIN' ? '👑 Quản Trị Viên' : '💼 ' + user.name + ' (' + user.id + ')'}
                        </span>
                      </div>
                    </div>

                    {/* Tiện ích & Nút Đăng Xuất */}
                    <div className="flex items-center gap-3 sm:gap-4">
                      {/* Trạng thái Supabase Cloud Sync */}
                      {cloudStatus === 'CONNECTED' ? (
                        <div className="hidden md:flex items-center gap-1.5 px-3 py-1.5 rounded-full text-[11px] font-bold bg-emerald-500/15 text-emerald-400 border border-emerald-500/30">
                          <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                          <span>Cloud Sync: Online</span>
                        </div>
                      ) : (
                        <div className="hidden md:flex items-center gap-1.5 px-3 py-1.5 rounded-full text-[11px] font-bold bg-amber-500/15 text-amber-300 border border-amber-500/30" title="Chạy supabase_schema.sql trong Supabase để bật Cloud Realtime">
                          <span className="w-2 h-2 rounded-full bg-amber-400"></span>
                          <span>Local Mode (Chờ SQL)</span>
                        </div>
                      )}

                      {user.role === 'STAFF' && (
                        <div className="hidden sm:flex items-center gap-2 glass-neon-card px-4 py-2 rounded-xl border border-slate-800">
                          <Wallet className="w-4 h-4 text-emerald-400" />
                          <span className="text-xs text-blue-200">Ví COD:</span>
                          <span className="font-mono font-extrabold text-sm text-emerald-400">{formatVND(user.balance)}</span>
                        </div>
                      )}

                      <button
                        onClick={handleLogout}
                        className="flex items-center gap-2 px-4 py-2.5 rounded-xl text-xs font-bold transition text-rose-300 hover:text-white bg-rose-500/10 hover:bg-rose-500/25 border border-rose-500/30 shadow-sm shadow-black/20 cursor-pointer"
                      >
                        <LogOut className="w-4 h-4 text-rose-400" />
                        <span>Đăng xuất</span>
                      </button>
                    </div>

                  </div>
                </div>
              </header>

              {/* MAIN CONTENT CONTAINER */}
              <main className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex-1 w-full">
                {user.role === 'ADMIN' ? (
                  <AdminView
                    staffList={staffList}
                    setStaffList={setStaffList}
                    orders={orders}
                    setOrders={setOrders}
                    transactions={transactions}
                    setTransactions={setTransactions}
                    withdrawRequests={withdrawRequests}
                    setWithdrawRequests={setWithdrawRequests}
                    showToast={showToast}
                  />
                ) : (
                  <StaffView
                    user={user}
                    setUser={setUser}
                    staffList={staffList}
                    setStaffList={setStaffList}
                    orders={orders}
                    setOrders={setOrders}
                    transactions={transactions}
                    setTransactions={setTransactions}
                    withdrawRequests={withdrawRequests}
                    setWithdrawRequests={setWithdrawRequests}
                    showToast={showToast}
                  />
                )}
              </main>

              {/* FOOTER */}
              <footer className="border-t border-slate-800 py-5 text-center text-xs text-blue-300/60 bg-[#040d25]/90">
                Hệ Thống Quản Lý Đơn Hàng & Vận Hành Affiliate (OMS) © 2026 - Môn học: Thương Mại Điện Tử
              </footer>
            </>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
